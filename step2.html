<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step 2 of 4</title>
<link rel="stylesheet" href="style.css">
<style>
  .ad-slot {
    min-height: 250px !important;
    margin: 25px 0 !important;
  }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="card">

    <div class="step-indicator">Step 2 of 4</div>

    <div class="video-container">
      <video controls poster="" class="tutorial-video">
        <source src="tutorial.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="notice-box">
      Please stay on this page to complete verification step 2 of 4.
    </div>

    <!-- 28 ADS FOR LONG MANUAL SCROLL -->
    <div id="ads-stream">
      <script>
        for (let i = 1; i <= 28; i++) {
          document.write(`
            <div class="ad-slot">
              <!-- APNA AD UNIT CODE YAHAN RAKHEIN -->
              Advertisement #${i}
            </div>
          `);
        }
      </script>
    </div>

    <button id="continue-btn" class="btn btn-primary" style="margin-top: 30px;">Continue to Step 3</button>

  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const data = params.get('data');

  const continueBtn = document.getElementById('continue-btn');
  const step1Done = sessionStorage.getItem('step1_done');

  if (!data) {
    continueBtn.disabled = true;
    continueBtn.textContent = 'Missing link data';
  } else if (step1Done !== data) {
    window.location.href = `step1.html?data=${encodeURIComponent(data)}`;
  } else {
    continueBtn.addEventListener('click', function () {
      sessionStorage.setItem('step2_done', data);
      window.location.href = `step3.html?data=${encodeURIComponent(data)}`;
    });
  }
</script>

</body>
</html>
