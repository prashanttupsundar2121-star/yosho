<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step 1 of 4</title>
<link rel="stylesheet" href="style.css">

<style>
  body {
    background-color: #0f1015;
    color: #ffffff;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .page-wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 15px 120px 15px;
  }
  .card {
    background: #181920;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid #2d2f39;
  }
  .step-indicator {
    font-weight: 700;
    font-size: 1.1em;
    color: #4f46e5;
    text-align: center;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 15px;
  }
  .timer-box {
    text-align: center;
    background: #111217;
    padding: 14px;
    border-radius: 8px;
    margin: 18px 0;
    font-weight: bold;
    border: 1px solid #2d2f39;
    font-size: 1.05em;
    color: #e5e7eb;
  }
  .scroll-notice {
    display: none;
    padding: 14px;
    background: #231f10;
    color: #facc15;
    border: 1px dashed #ca8a04;
    text-align: center;
    border-radius: 8px;
    margin: 20px 0;
    font-weight: bold;
    font-size: 1em;
    animation: bounce 1.5s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .ad-slot {
    min-height: 250px;
    background: #111217;
    border: 1px dashed #374151;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 22px 0;
    border-radius: 8px;
    color: #9ca3af;
    font-size: 13px;
    text-align: center;
    text-decoration: none;
    padding: 10px;
    box-sizing: border-box;
  }
  .ad-slot span.ad-badge {
    font-size: 10px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .ad-slot p.ad-content {
    margin: 0;
    color: #cbd5e1;
    font-weight: 500;
  }
  .video-container {
    width: 100%;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    margin: 18px 0;
    border: 1px solid #2d2f39;
  }
  .tutorial-video {
    width: 100%;
    display: block;
  }
  .btn-disabled {
    opacity: 0.4;
    cursor: not-allowed !important;
  }
  .btn-primary {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 17px;
    border-radius: 8px;
    border: none;
    background: #4f46e5;
    color: #ffffff;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    box-sizing: border-box;
    transition: 0.2s ease;
  }
  .btn-primary:hover:not(.btn-disabled) {
    background: #4338ca;
  }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="card">

    <div class="step-indicator">Step 1 of 4</div>

    <!-- 3s Delay + 25s Countdown Timer -->
    <div class="timer-box" id="main-timer-container">
      <span id="delay-text">Loading verification system... Please wait...</span>
      <span id="top-timer-wrapper" style="display: none;">
        Please Wait: <span id="top-timer" style="color: #ef4444; font-size: 1.25em;">25</span> Seconds
      </span>
    </div>

    <!-- Video Box -->
    <div class="video-container">
      <video controls poster="" class="tutorial-video">
        <source src="tutorial.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div id="scroll-notice" class="scroll-notice">
      👇 Scroll Down To The Bottom To Verify & Continue 👇
    </div>

    <!-- 28 DYNAMIC REVENUE AD SLOTS -->
    <div id="ads-stream">
      <script>
        for (let i = 1; i <= 28; i++) {
          document.write(`
            <div class="ad-slot" id="ad-unit-${i}">
              <span class="ad-badge">Sponsored Advertisement #${i}</span>
              <p class="ad-content">Featured Sponsored Partner Offer</p>
            </div>
          `);
        }
      </script>
    </div>

    <!-- Bottom Scroll Verification Section -->
    <div id="bottom-section" style="margin-top: 30px;">
      <div class="timer-box">
        <span id="bottom-timer-text">Scroll Down Here To Verify</span>
      </div>
      <button id="continue-btn" class="btn-primary btn-disabled" disabled>Please Wait...</button>
    </div>

  </div>
</div>

<script>
  const NEXT_PAGE = "step2.html";
  const params = new URLSearchParams(window.location.search);
  const data = params.get('data');

  const continueBtn = document.getElementById('continue-btn');
  const delayTextEl = document.getElementById('delay-text');
  const topTimerWrapperEl = document.getElementById('top-timer-wrapper');
  const topTimerEl = document.getElementById('top-timer');
  const scrollNoticeEl = document.getElementById('scroll-notice');
  const bottomTimerTextEl = document.getElementById('bottom-timer-text');
  const bottomSectionEl = document.getElementById('bottom-section');

  let topTimeLeft = 25;
  let bottomTimeLeft = 5;
  let topTimerFinished = false;
  let bottomTimerStarted = false;

  if (!data) {
    continueBtn.disabled = true;
    continueBtn.textContent = 'Missing link data';
  } else {
    // 1. Initial 3s Delay before 25s Countdown Starts
    setTimeout(() => {
      delayTextEl.style.display = 'none';
      topTimerWrapperEl.style.display = 'inline';

      const topInterval = setInterval(() => {
        topTimeLeft--;
        topTimerEl.textContent = topTimeLeft;

        if (topTimeLeft <= 0) {
          clearInterval(topInterval);
          topTimerFinished = true;
          scrollNoticeEl.style.display = 'block';
        }
      }, 1000);
    }, 3000);

    // 2. Window Scroll Detection for Bottom Verification Trigger
    window.addEventListener('scroll', checkScroll);

    function checkScroll() {
      if (topTimerFinished && !bottomTimerStarted) {
        const rect = bottomSectionEl.getBoundingClientRect();
        if (rect.top <= window.innerHeight) {
          bottomTimerStarted = true;
          startBottomTimer();
        }
      }
    }

    function startBottomTimer() {
      bottomTimerTextEl.textContent = `Please Wait: ${bottomTimeLeft} Seconds...`;

      const bottomInterval = setInterval(() => {
        bottomTimeLeft--;
        bottomTimerTextEl.textContent = `Please Wait: ${bottomTimeLeft} Seconds...`;

        if (bottomTimeLeft <= 0) {
          clearInterval(bottomInterval);
          bottomTimerTextEl.textContent = "Verification Complete!";
          continueBtn.disabled = false;
          continueBtn.classList.remove('btn-disabled');
          continueBtn.textContent = 'Continue to Step 2 →';
        }
      }, 1000);
    }

    // 3. Store Step Progress and Navigate
    continueBtn.addEventListener('click', function () {
      if (!continueBtn.disabled) {
        sessionStorage.setItem('step1_done', data);
        window.location.href = `${NEXT_PAGE}?data=${encodeURIComponent(data)}`;
      }
    });
  }
</script>

</body>
</html>
