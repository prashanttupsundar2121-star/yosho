<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1 of 4</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0f1015;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .step-title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #3b82f6;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .timer-box {
      width: 100%;
      background: #181920;
      border: 1px solid #2d2f39;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-size: 0.95rem;
      color: #d1d5db;
      margin-bottom: 20px;
    }
    .timer-sec {
      color: #ef4444;
      font-weight: bold;
    }
    .video-box {
      width: 100%;
      height: 220px;
      background: #181920;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #2d2f39;
      margin-bottom: 20px;
    }
    .scroll-indicator-text {
      color: #6b7280;
      font-size: 0.85rem;
      margin: 15px 0;
      text-align: center;
    }
    .ad-card {
      width: 100%;
      min-height: 250px;
      background: #181920;
      border: 1px dashed #374151;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 0.85rem;
      margin-bottom: 25px;
    }
    .bottom-section {
      width: 100%;
      margin-top: 30px;
      margin-bottom: 80px;
      text-align: center;
    }
    .btn-verify {
      width: 100%;
      background: #1f222e;
      color: #9ca3af;
      border: 1px solid #374151;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 12px;
      cursor: default;
    }
    .btn-next {
      display: block;
      width: 100%;
      background: #374151;
      color: #9ca3af;
      padding: 15px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      pointer-events: none;
      transition: 0.3s;
    }
    .btn-next.active {
      background: #2563eb;
      color: #ffffff;
      pointer-events: auto;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="step-title">STEP 1 OF 4</div>

    <!-- Timer Box -->
    <div class="timer-box">
      Please Wait: <span id="time" class="timer-sec">25</span> Seconds
    </div>

    <!-- Video Box -->
    <div class="video-box">
      <svg width="40" height="40" fill="#4b5563" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
    </div>

    <div class="scroll-indicator-text">Scroll Down For Links & Verification Content</div>

    <!-- 28 ADS FOR LONG MANUAL SCROLL -->
    <div id="ads-container" style="width: 100%;">
      <script>
        for (let i = 1; i <= 28; i++) {
          document.write(`
            <div class="ad-card">
              <!-- APNA AD SCRIPT/BANNER CODE YAHAN DAALEIN -->
              Advertisement #${i}
            </div>
          `);
        }
      </script>
    </div>

    <!-- Bottom Verification and Step 2 Button -->
    <div class="bottom-section">
      <div class="btn-verify">Scroll Down Here To Verify</div>
      <a href="step2.html" id="next-btn" class="btn-next">Please Wait...</a>
    </div>
  </div>

  <!-- Timer Script -->
  <script>
    let timeLeft = 25;
    const timerElem = document.getElementById('time');
    const nextBtn = document.getElementById('next-btn');

    const countdown = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        timerElem.textContent = timeLeft;
      } else {
        clearInterval(countdown);
        timerElem.textContent = "0";
        nextBtn.textContent = "Continue to Step 2 →";
        nextBtn.classList.add('active');
      }
    }, 1000);
  </script>

</body>
</html>
