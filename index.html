<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Shortener</title>
<link rel="stylesheet" href="style.css">

<!-- ============================================= -->
<!-- AD NETWORK SCRIPT — paste your ad network's    -->
<!-- main <script> tag here (AdSense/Adsterra/etc.) -->
<!-- ============================================= -->

</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1>Shorten. Share. Track.</h1>
    <p>Paste any destination link below and generate a shortened gateway URL in seconds.</p>
  </div>
</header>

<div class="page-wrap">
  <div class="card">
    <form id="shorten-form">
      <label for="destination-url">Destination URL</label>
      <input
        type="url"
        id="destination-url"
        name="destination-url"
        placeholder="https://example.com/your-long-link"
        required
      >
      <button type="submit" class="btn btn-primary">Generate Short Link</button>
    </form>

    <div id="result-box" class="result-box hidden">
      <p class="result-label">Your short link:</p>
      <div class="result-row">
        <input type="text" id="result-link" readonly>
        <button id="copy-btn" class="btn btn-secondary">Copy Short Link</button>
      </div>
      <a id="open-link" class="btn btn-primary link-btn" href="#">Open Link</a>
    </div>

    <!-- Ad unit — paste your ad network's ad unit code here -->
    <div id="ad-home" class="ad-slot"></div>
  </div>
</div>

<script>
  const form = document.getElementById('shorten-form');
  const resultBox = document.getElementById('result-box');
  const resultLink = document.getElementById('result-link');
  const openLink = document.getElementById('open-link');
  const copyBtn = document.getElementById('copy-btn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const rawUrl = document.getElementById('destination-url').value.trim();
    if (!rawUrl) return;

    // Encode destination URL as base64 (URL-safe), then URL-encode for the query string
    const base64 = btoa(rawUrl)
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');

    const encoded = encodeURIComponent(base64);
    const basePath = window.location.pathname.replace('index.html', '');
    const shortLink = `${window.location.origin}${basePath}step1.html?data=${encoded}`;

    resultLink.value = shortLink;
    openLink.href = shortLink;
    resultBox.classList.remove('hidden');
  });

  copyBtn.addEventListener('click', function () {
    resultLink.select();
    resultLink.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(resultLink.value).then(() => {
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy Short Link'; }, 1500);
    });
  });
</script>

</body>
</html>
